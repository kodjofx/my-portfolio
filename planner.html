<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner | Kodjo Sunday</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Planner-specific styles — safe to move into style.css if you prefer one file */
  .planner-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }
  .planner-form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
  }
  .planner-form input,
  .planner-form select {
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
    flex: 1;
    min-width: 150px;
  }
  .planner-form button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background-color: #4aa8ff;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  .planner-form button:hover {
    background-color: #2d8fe0;
  }
  .task-summary {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .summary-card {
    background-color: #16324f;
    padding: 15px 25px;
    border-radius: 8px;
    text-align: center;
    flex: 1;
    min-width: 120px;
  }
  .summary-card span {
    display: block;
    font-size: 22px;
    font-weight: bold;
    color: #4aa8ff;
  }
  table.task-table {
    width: 100%;
    border-collapse: collapse;
    background-color: #0d2338;
    border-radius: 8px;
    overflow: hidden;
  }
  table.task-table th, table.task-table td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #1f3f5f;
  }
  table.task-table th {
    background-color: #16324f;
    color: #4aa8ff;
  }
  .status-pending { color: #f5a623; font-weight: bold; }
  .status-completed { color: #2ecc71; font-weight: bold; }
  .delete-btn {
    background: none;
    border: none;
    color: #ff5c5c;
    cursor: pointer;
    font-size: 15px;
  }
  .toggle-btn {
    background: none;
    border: none;
    color: #4aa8ff;
    cursor: pointer;
    font-size: 15px;
  }
  .empty-msg {
    text-align: center;
    padding: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<header>
  <h1>Kodjo Sunday</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="project.html">Project</a>
    <a href="planner.html">Planner</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="page planner-wrap">
  <h2>Academic Planner</h2>
  <p>Add your tasks below and keep track of what's pending and completed.</p>

  <form class="planner-form" id="taskForm">
    <input type="text" id="taskName" placeholder="Task name" required>
    <input type="text" id="taskSubject" placeholder="Subject" required>
    <input type="date" id="taskDate" required>
    <button type="submit">Add Task</button>
  </form>

  <div class="task-summary">
    <div class="summary-card">Total<span id="totalCount">0</span></div>
    <div class="summary-card">Completed<span id="completedCount">0</span></div>
    <div class="summary-card">Pending<span id="pendingCount">0</span></div>
  </div>

  <table class="task-table">
    <thead>
      <tr>
        <th>Task</th>
        <th>Subject</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="taskTableBody">
      <!-- Rows are injected by JavaScript -->
    </tbody>
  </table>
  <p class="empty-msg" id="emptyMsg">No tasks yet — add one above to get started.</p>
</section>

<footer>
  <p>&copy; 2026 Kodjo Sunday | MIVA Open University</p>
</footer>

<script>
  // Task list stored in memory (array of objects)
  let tasks = [
    { name: "Complete JavaScript Assignment", subject: "Web Development", date: "2026-07-17", status: "pending" },
    { name: "Study for Cybersecurity Quiz", subject: "Cybersecurity", date: "2026-07-18", status: "pending" }
  ];

  const form = document.getElementById("taskForm");
  const tableBody = document.getElementById("taskTableBody");
  const emptyMsg = document.getElementById("emptyMsg");
  const totalCount = document.getElementById("totalCount");
  const completedCount = document.getElementById("completedCount");
  const pendingCount = document.getElementById("pendingCount");

  function renderTasks() {
    tableBody.innerHTML = ""; // clear existing rows

    if (tasks.length === 0) {
      emptyMsg.style.display = "block";
    } else {
      emptyMsg.style.display = "none";
    }

    tasks.forEach((task, index) => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${task.name}</td>
        <td>${task.subject}</td>
        <td>${task.date}</td>
        <td class="status-${task.status}">${task.status === "completed" ? "Completed" : "Pending"}</td>
        <td>
          <button class="toggle-btn" data-index="${index}">
            ${task.status === "completed" ? "Mark Pending" : "Mark Done"}
          </button>
          <button class="delete-btn" data-index="${index}">Delete</button>
        </td>
      `;

      tableBody.appendChild(row);
    });

    updateSummary();
  }

  function updateSummary() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.status === "completed").length;
    const pending = total - completed;

    totalCount.textContent = total;
    completedCount.textContent = completed;
    pendingCount.textContent = pending;
  }

  // Add new task
  form.addEventListener("submit", function (e) {
    e.preventDefault(); // stop page reload

    const name = document.getElementById("taskName").value.trim();
    const subject = document.getElementById("taskSubject").value.trim();
    const date = document.getElementById("taskDate").value;

    if (!name || !subject || !date) return;

    tasks.push({ name, subject, date, status: "pending" });

    form.reset();
    renderTasks();
  });

  // Handle mark-done and delete clicks (event delegation)
  tableBody.addEventListener("click", function (e) {
    const index = e.target.getAttribute("data-index");
    if (index === null) return;

    if (e.target.classList.contains("toggle-btn")) {
      tasks[index].status = tasks[index].status === "completed" ? "pending" : "completed";
      renderTasks();
    }

    if (e.target.classList.contains("delete-btn")) {
      tasks.splice(index, 1);
      renderTasks();
    }
  });

  // Initial render on page load
  renderTasks();
</script>

</body>
</html>
